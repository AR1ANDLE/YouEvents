<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

        <section class="inscription-form">

                <div class="fields">

                    <div class="field"></div>
                </div>
                <div class="fields">

                </div>
                <div class="event-picker"></div>
                <div class="level-picker"></div>
                <div class="msg-field"></div>
                <div class="terms"></div>
                <button class="primary-btn"></button>
            </form>
        </section>
    </main>

    <footer>
        <div class="row">
            <div class="youcode"></div>
            <div class="navigation"></div>
            <div class="contact"></div>
        </div>
        <section class="copyright"></section>
